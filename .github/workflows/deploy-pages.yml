name: Deploy StudyMate PWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: study-mate-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare and validate static PWA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html app.js styles.css manifest.webmanifest sw.js robots.txt site/
          cp -R assets site/assets
          test -f site/index.html
          test -f site/assets/data.js
          test -f site/manifest.webmanifest
          test -f site/sw.js
          node --check site/app.js
          echo "StudyMate PWA files are ready."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
